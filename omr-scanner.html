<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>नवोदय OMR शीट अचूक स्कॅनर</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700;800&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', sans-serif; }
    body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }

    .header-box { text-align: center; margin-bottom: 8px; width: 100%; max-width: 380px; }
    .header-box h2 { font-size: 1.15rem; color: #38bdf8; font-weight: 800; }
    .std-badge { background: #1e293b; color: #fef08a; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.92rem; display: inline-block; margin-top: 4px; border: 1px solid #334155; }

    .camera-frame {
      position: relative;
      width: 100%;
      max-width: 300px;
      height: 360px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 4px solid #10b981;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; }

    .guide-overlay {
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(52, 211, 153, 0.85);
      border-radius: 10px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
    }
    .status-pill {
      background: rgba(5, 150, 105, 0.9);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
    }

    .summary-card {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      color: #0f172a;
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
    .sum-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px; font-size: 0.84rem; font-weight: 700; display: flex; justify-content: space-between; }
    .score-banner { background: #059669; color: white; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }

    .btn-wrap { display: flex; gap: 8px; width: 100%; max-width: 340px; margin-top: 10px; }
    .btn { flex: 1; height: 48px; border-radius: 10px; border: none; font-weight: 800; font-size: 0.98rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-cancel { background: #334155; color: white; }
    .btn-capture { background: #0284c7; color: white; font-size: 1.05rem; }
    .btn-submit { background: #10b981; color: white; }
  </style>
</head>
<body>

  <div class="header-box">
    <h2><i class="fa-solid fa-camera"></i> नवोदय OMR शीट अचूक स्कॅनर</h2>
    <div class="std-badge" id="std-display">विद्यार्थी: लोड होत आहे...</div>
    <div id="key-status" style="font-size:0.75rem; color:#34d399; margin-top:2px;">उत्तरतालिका: तपासून तयार</div>
  </div>

  <div class="camera-frame" id="cam-frame">
    <video id="video" autoplay playsinline></video>
    <div class="guide-overlay">
      <span class="status-pill" id="status-pill">✅ कॅमेरा तयार आहे</span>
      <span style="background:rgba(15,23,42,0.8); color:#cbd5e1; font-size:0.75rem; padding:3px 10px; border-radius:12px;">📸 ओएमआर शीट फ्रेममध्ये धरून बटण दाबा</span>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <div class="summary-card" id="summary-card">
    <div style="font-weight:800; color:#059669; border-bottom:1.5px solid #e2e8f0; padding-bottom:4px;">
      <i class="fa-solid fa-square-poll-vertical"></i> OMR तपासणी गोशवारा:
    </div>
    <div class="summary-grid">
      <div class="sum-item">सोडवलेले: <strong id="sum-attempted" style="font-family:'Poppins';">--/80</strong></div>
      <div class="sum-item" style="color:#16a34a;">बरोबर: <strong id="sum-correct" style="font-family:'Poppins';">--</strong></div>
      <div class="sum-item" style="color:#dc2626;">चुकीचे: <strong id="sum-wrong" style="font-family:'Poppins';">--</strong></div>
      <div class="sum-item" style="color:#d97706;">दुहेरी/अवैध: <strong id="sum-invalid" style="font-family:'Poppins';">--</strong></div>
    </div>
    <div class="score-banner">
      <span>अंतिम गुण (प्रत्येकी १.२५ गुण):</span>
      <span id="sum-score" style="font-size:1.3rem; font-family:'Poppins'; color:#fef08a;">--/100</span>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="btn btn-cancel" onclick="window.close()"><i class="fa-solid fa-xmark"></i> रद्द करा</button>
    <button class="btn btn-capture" id="btn-capture" onclick="scanRealOmrSheet()"><i class="fa-solid fa-camera-rotate"></i> OMR स्कॅन करा</button>
    <button class="btn btn-submit" id="btn-submit" style="display:none;" onclick="submitScoreAndClose()"><i class="fa-solid fa-check"></i> गुण सबमिट करा</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');
    const studentName = decodeURIComponent(urlParams.get('name') || 'विद्यार्थी');
    const testNo = urlParams.get('test') || '6';

    document.getElementById('std-display').innerText = `विद्यार्थी: ${studentName}`;

    let calculatedMarks = 0;
    const rawKeys = JSON.parse(localStorage.getItem('omr_saved_key') || '{}');
    const savedKeys = {};
    for (let i = 1; i <= 80; i++) {
      if (rawKeys[i]) {
        savedKeys[i] = String(rawKeys[i]).trim().toUpperCase();
      }
    }

    const keyCount = Object.keys(savedKeys).length;
    if (keyCount > 0) {
      document.getElementById('key-status').innerText = `✅ उत्तरतालिका उपलब्ध (${keyCount} प्रश्न)`;
    } else {
      document.getElementById('key-status').innerText = `⚠️ चेतावणी: उत्तरतालिका मिळालेली नाही!`;
      document.getElementById('key-status').style.color = '#ef4444';
    }

    // कॅमेरा सुरू करणे
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
      }).then(stream => {
        const video = document.getElementById('video');
        video.srcObject = stream;
      }).catch(err => alert("कॅमेरा सुरू होऊ शकला नाही: " + err.message));
    }

    // खरी ओएमआर शीट पिक्सेल द्वारे अचूक तपासणारे मुख्य इंजिन
    function scanRealOmrSheet() {
      const video = document.getElementById('video');
      if (!video || video.readyState !== 4) {
        alert("कॅमेरा अद्याप तयार नाही, कृपया थोडा वेळ थांबा.");
        return;
      }

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const vWidth = video.videoWidth || 1280;
      const vHeight = video.videoHeight || 720;
      canvas.width = vWidth;
      canvas.height = vHeight;
      ctx.drawImage(video, 0, 0, vWidth, vHeight);

      const imgData = ctx.getImageData(0, 0, vWidth, vHeight);
      const pixels = imgData.data;

      // विशिष्ट वर्तुळाच्या जागेवरील काळेपणा (Darkness) तपासणारी फंक्शन्स
      function getBubbleDarkness(cx, cy) {
        let darkCount = 0;
        let totalCount = 0;
        for (let x = cx - 4; x <= cx + 4; x += 2) {
          for (let y = cy - 4; y <= cy + 4; y += 2) {
            if (x >= 0 && x < vWidth && y >= 0 && y < vHeight) {
              const idx = (Math.floor(y) * vWidth + Math.floor(x)) * 4;
              // ग्रेस्केल ब्राइटनेस काढणे
              const brightness = pixels[idx] * 0.299 + pixels[idx+1] * 0.587 + pixels[idx+2] * 0.114;
              if (brightness < 110) { // गडद शाई असल्यास
                darkCount++;
              }
              totalCount++;
            }
          }
        }
        return totalCount > 0 ? (darkCount / totalCount) : 0;
      }

      // नवोदय ओएमआर शीटच्या मुख्य प्रश्नांचा टेबल (४ स्तंभ आणि २० ओळी)
      const tableLeft = vWidth * 0.12;
      const tableTop = vHeight * 0.32;
      const tableWidth = vWidth * 0.76;
      const tableHeight = vHeight * 0.60;

      const colWidth = tableWidth / 4;
      const rowHeight = tableHeight / 20;
      const optLetters = ['A', 'B', 'C', 'D'];
      let studentAnswers = {};

      for (let col = 0; col < 4; col++) {
        for (let row = 0; row < 20; row++) {
          const qNo = col * 20 + (row + 1);
          const qY = tableTop + (row + 0.5) * rowHeight;
          const qColX = tableLeft + col * colWidth;

          let detectedForThisQ = [];
          for (let optIdx = 0; optIdx < 4; optIdx++) {
            // A, B, C, D चारही पर्यायांची अचूक जागा
            const bubbleX = qColX + (colWidth * 0.32) + (optIdx * (colWidth * 0.16));
            const darknessRatio = getBubbleDarkness(bubbleX, qY);

            // जर वर्तुळ ३५% पेक्षा जास्त भरलेले असेल तरच ग्राह्य धरले जाईल
            if (darknessRatio > 0.35) {
              detectedForThisQ.push(optLetters[optIdx]);
            }
          }

          if (detectedForThisQ.length === 1) {
            studentAnswers[qNo] = detectedForThisQ[0];
          } else if (detectedForThisQ.length > 1) {
            studentAnswers[qNo] = 'INVALID'; // एकापेक्षा जास्त वर्तुळे भरली असल्यास
          } else {
            studentAnswers[qNo] = null; // प्रश्न सोडवलेला नाही
          }
        }
      }

      // उत्तरतालिका (Answer Key) सोबत तुलना करून गुण मोजणे
      let attemptedCount = 0;
      let correctCount = 0;
      let wrongCount = 0;
      let invalidCount = 0;

      for (let q = 1; q <= 80; q++) {
        const stdAns = studentAnswers[q];
        const correctAns = savedKeys[q];

        if (stdAns === 'INVALID') {
          invalidCount++;
          attemptedCount++;
        } else if (stdAns) {
          attemptedCount++;
          if (stdAns === correctAns) {
            correctCount++;
          } else {
            wrongCount++;
          }
        }
      }

      calculatedMarks = parseFloat((correctCount * 1.25).toFixed(2));

      // गोशवारा स्क्रीनवर दाखवणे
      document.getElementById('sum-attempted').innerText = `${attemptedCount}/80`;
      document.getElementById('sum-correct').innerText = correctCount;
      document.getElementById('sum-wrong').innerText = wrongCount;
      document.getElementById('sum-invalid').innerText = invalidCount;
      document.getElementById('sum-score').innerText = `${calculatedMarks}/100`;

      document.getElementById('summary-card').style.display = 'block';
      document.getElementById('btn-capture').style.display = 'none';
      document.getElementById('btn-submit').style.display = 'flex';
      document.getElementById('btn-submit').innerText = `गुण सबमिट करा (${calculatedMarks})`;
      
      showToast("OMR शीट यशस्वीरीत्या तपासली!");
    }

    function submitScoreAndClose() {
      localStorage.setItem('scanned_result', JSON.stringify({
        id: studentId,
        marks: calculatedMarks,
        timestamp: Date.now()
      }));
      window.close();
    }

    function showToast(msg) {
      // साधे नोटिफिकेशन
      console.log(msg);
    }
  </script>
</body>
</html>
