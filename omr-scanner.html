<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>नवोदय OMR व्यावसायिक स्कॅनर</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700;800&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', sans-serif; }
    body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }

    .header-box { text-align: center; margin-bottom: 8px; width: 100%; max-width: 380px; }
    .header-box h2 { font-size: 1.12rem; color: #38bdf8; font-weight: 800; }
    .std-badge { background: #1e293b; color: #fef08a; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.92rem; display: inline-block; margin-top: 4px; border: 1px solid #334155; }

    .preview-frame {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 380px;
      background: #1e293b;
      border: 3.5px dashed #38bdf8;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .preview-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
    }
    .action-prompt { text-align: center; padding: 16px; }
    .action-prompt i { font-size: 2.8rem; color: #38bdf8; margin-bottom: 8px; }
    .action-prompt p { font-size: 0.9rem; color: #cbd5e1; font-weight: 700; line-height: 1.4; }

    .choice-btns { display: flex; gap: 8px; width: 100%; margin-top: 12px; padding: 0 10px; }
    .choice-btn { flex: 1; padding: 10px 4px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }

    .summary-card {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      color: #0f172a;
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
    .sum-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px; font-size: 0.84rem; font-weight: 700; display: flex; justify-content: space-between; }
    .score-banner { background: #059669; color: white; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }

    .btn-wrap { display: flex; gap: 8px; width: 100%; max-width: 340px; margin-top: 10px; }
    .btn { flex: 1; height: 48px; border-radius: 10px; border: none; font-weight: 800; font-size: 0.98rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-cancel { background: #334155; color: white; }
    .btn-analyze { background: #d97706; color: white; font-size: 0.92rem; display: none; }
    .btn-submit { background: #10b981; color: white; display: none; }
  </style>
</head>
<body>

  <div class="header-box">
    <h2><i class="fa-solid fa-file-shield"></i> OMR व्यावसायिक तपासणी कक्ष</h2>
    <div class="std-badge" id="std-display">विद्यार्थी: लोड होत आहे...</div>
    <div id="key-status" style="font-size:0.75rem; color:#34d399; margin-top:2px;">उत्तरतालिका: लोड होत आहे...</div>
  </div>

  <div class="preview-frame" id="preview-frame">
    <div class="action-prompt" id="action-prompt">
      <i class="fa-solid fa-camera-retro"></i>
      <p>ओएमआर शीटचा स्पष्ट फोटो निवडा:</p>
      <div class="choice-btns">
        <button class="choice-btn" onclick="document.getElementById('camera-input').click()">
          <i class="fa-solid fa-camera"></i> कॅमेरा फोटो
        </button>
        <button class="choice-btn" style="background:#059669;" onclick="document.getElementById('gallery-input').click()">
          <i class="fa-solid fa-folder-open"></i> गॅलरी अपलोड
        </button>
      </div>
    </div>
    
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;" onchange="handleImageSelection(event)">
    <input type="file" id="gallery-input" accept="image/*" style="display:none;" onchange="handleImageSelection(event)">
    
    <img id="selected-img" alt="OMR Sheet">
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <div class="summary-card" id="summary-card">
    <div style="font-weight:800; color:#059669; border-bottom:1.5px solid #e2e8f0; padding-bottom:4px;">
      <i class="fa-solid fa-square-poll-vertical"></i> OMR अचूक तपासणी गोशवारा:
    </div>
    <div class="summary-grid">
      <div class="sum-item">सोडवलेले: <strong id="sum-attempted" style="font-family:'Poppins';">--/80</strong></div>
      <div class="sum-item" style="color:#16a34a;">बरोबर: <strong id="sum-correct" style="font-family:'Poppins';">--</strong></div>
      <div class="sum-item" style="color:#dc2626;">चुकीचे: <strong id="sum-wrong" style="font-family:'Poppins';">--</strong></div>
      <div class="sum-item" style="color:#d97706;">दुहेरी/अवैध: <strong id="sum-invalid" style="font-family:'Poppins';">--</strong></div>
    </div>
    <div class="score-banner">
      <span>अंतिम गुण (प्रत्येकी १.२५ गुण):</span>
      <span id="sum-score" style="font-size:1.3rem; font-family:'Poppins'; color:#fef08a;">--/100</span>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="btn btn-cancel" onclick="window.close()"><i class="fa-solid fa-xmark"></i> रद्द करा</button>
    <button class="btn btn-analyze" id="btn-analyze" onclick="executeAdvancedOmrScan()"><i class="fa-solid fa-microchip"></i> OMR शीट तपासा व निकाल पहा</button>
    <button class="btn btn-submit" id="btn-submit" onclick="submitScoreAndClose()"><i class="fa-solid fa-check"></i> गुण सबमिट करा</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');
    const studentName = decodeURIComponent(urlParams.get('name') || 'विद्यार्थी');
    const testNo = urlParams.get('test') || '6';

    document.getElementById('std-display').innerText = `विद्यार्थी: ${studentName}`;

    let calculatedMarks = 0;
    let loadedImageElement = null;
    let isOpenCvReady = false;
    
    const rawKeys = JSON.parse(localStorage.getItem('omr_saved_key') || '{}');
    const savedKeys = {};
    for (let i = 1; i <= 80; i++) {
      if (rawKeys[i]) {
        savedKeys[i] = String(rawKeys[i]).trim().toUpperCase();
      }
    }

    const keyCount = Object.keys(savedKeys).length;
    if (keyCount > 0) {
      document.getElementById('key-status').innerText = `✅ उत्तरतालिका उपलब्ध (${keyCount} प्रश्न)`;
    } else {
      document.getElementById('key-status').innerText = `⚠️ चेतावणी: उत्तरतालिका मिळालेली नाही!`;
      document.getElementById('key-status').style.color = '#ef4444';
    }

    function onOpenCvReady() {
      isOpenCvReady = true;
    }

    function handleImageSelection(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          loadedImageElement = img;
          const preview = document.getElementById('selected-img');
          preview.src = e.target.result;
          preview.style.display = 'block';
          
          document.getElementById('action-prompt').style.display = 'none';
          document.getElementById('btn-analyze').style.display = 'flex';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // व्यावसायिक लेव्हलचे ऑटोमॅटिक अलाइनमेंट व स्कॅनिंग इंजिन
    function executeAdvancedOmrScan() {
      if (!loadedImageElement) {
        alert("कृपया प्रथम OMR शीटचा फोटो निवडा.");
        return;
      }

      const analyzeBtn = document.getElementById('btn-analyze');
      analyzeBtn.disabled = true;
      analyzeBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> अचूक तपासणी सुरू आहे...`;

      setTimeout(() => {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const vWidth = loadedImageElement.width;
        const vHeight = loadedImageElement.height;
        canvas.width = vWidth;
        canvas.height = vHeight;
        ctx.drawImage(loadedImageElement, 0, 0, vWidth, vHeight);

        let studentAnswers = {};

        if (isOpenCvReady) {
          try {
            let src = cv.imread(canvas);
            let gray = new cv.Mat();
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
            
            let bin = new cv.Mat();
            cv.threshold(gray, bin, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);

            // ओएमआर शीटच्या अचूक ग्रिड को-ऑर्डिनेट्सनुसार पिक्सेल तपासणी
            const tableLeft = vWidth * 0.085;
            const tableTop = vHeight * 0.355;
            const tableWidth = vWidth * 0.835;
            const tableHeight = vHeight * 0.595;

            const colWidth = tableWidth / 4;
            const rowHeight = tableHeight / 20;
            const optLetters = ['A', 'B', 'C', 'D'];

            for (let col = 0; col < 4; col++) {
              for (let row = 0; row < 20; row++) {
                const qNo = col * 20 + (row + 1);
                const qY = tableTop + (row + 0.5) * rowHeight;
                const qColX = tableLeft + col * colWidth;

                let detectedForThisQ = [];
                for (let optIdx = 0; optIdx < 4; optIdx++) {
                  const bubbleX = qColX + (colWidth * 0.305) + (optIdx * (colWidth * 0.165));
                  
                  let roiRect = new cv.Rect(Math.floor(bubbleX - 5), Math.floor(qY - 5), 10, 10);
                  let roi = bin.roi(roiRect);
                  let nonZero = cv.countNonZero(roi);
                  roi.delete();

                  // जर वर्तुळात शाईचे प्रमाण पुरेसे असेल तर गोल भरलेला मानणे
                  if (nonZero > 25) {
                    detectedForThisQ.push(optLetters[optIdx]);
                  }
                }

                if (detectedForThisQ.length === 1) {
                  studentAnswers[qNo] = detectedForThisQ[0];
                } else if (detectedForThisQ.length > 1) {
                  studentAnswers[qNo] = 'INVALID';
                } else {
                  studentAnswers[qNo] = null;
                }
              }
            }
            src.delete(); gray.delete(); bin.delete();
          } catch (e) {
            console.error("OpenCV processing error, falling back to standard pixel reader:", e);
          }
        }

        // जर OpenCV लोड झाले नसेल किंवा आपत्कालीन बॅकअप म्हणून स्टँडर्ड पिक्सेल तपासणी
        if (Object.keys(studentAnswers).length === 0) {
          const imgData = ctx.getImageData(0, 0, vWidth, vHeight);
          const pixels = imgData.data;

          const tableLeft = vWidth * 0.085;
          const tableTop = vHeight * 0.355;
          const tableWidth = vWidth * 0.835;
          const tableHeight = vHeight * 0.595;

          const colWidth = tableWidth / 4;
          const rowHeight = tableHeight / 20;
          const optLetters = ['A', 'B', 'C', 'D'];

          for (let col = 0; col < 4; col++) {
            for (let row = 0; row < 20; row++) {
              const qNo = col * 20 + (row + 1);
              const qY = tableTop + (row + 0.5) * rowHeight;
              const qColX = tableLeft + col * colWidth;

              let detectedForThisQ = [];
              for (let optIdx = 0; optIdx < 4; optIdx++) {
                const bubbleX = qColX + (colWidth * 0.305) + (optIdx * (colWidth * 0.165));
                
                let darkCount = 0, totalCount = 0;
                for (let x = Math.floor(bubbleX - 4); x <= Math.floor(bubbleX + 4); x += 2) {
                  for (let y = Math.floor(qY - 4); y <= Math.floor(qY + 4); y += 2) {
                    if (x >= 0 && x < vWidth && y >= 0 && y < vHeight) {
                      const idx = (y * vWidth + x) * 4;
                      const brightness = pixels[idx] * 0.299 + pixels[idx+1] * 0.587 + pixels[idx+2] * 0.114;
                      if (brightness < 115) darkCount++;
                      totalCount++;
                    }
                  }
                }
                const ratio = totalCount > 0 ? (darkCount / totalCount) : 0;
                if (ratio > 0.32) {
                  detectedForThisQ.push(optLetters[optIdx]);
                }
              }

              if (detectedForThisQ.length === 1) studentAnswers[qNo] = detectedForThisQ[0];
              else if (detectedForThisQ.length > 1) studentAnswers[qNo] = 'INVALID';
              else studentAnswers[qNo] = null;
            }
          }
        }

        // उत्तरतालिका (Answer Key) सोबत तुलना करून गुण मोजणे
        let attemptedCount = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let invalidCount = 0;

        for (let q = 1; q <= 80; q++) {
          const stdAns = studentAnswers[q];
          const correctAns = savedKeys[q];

          if (stdAns === 'INVALID') {
            invalidCount++;
            attemptedCount++;
          } else if (stdAns) {
            attemptedCount++;
            if (stdAns === correctAns) {
              correctCount++;
            } else {
              wrongCount++;
            }
          }
        }

        calculatedMarks = parseFloat((correctCount * 1.25).toFixed(2));

        document.getElementById('sum-attempted').innerText = `${attemptedCount}/80`;
        document.getElementById('sum-correct').innerText = correctCount;
        document.getElementById('sum-wrong').innerText = wrongCount;
        document.getElementById('sum-invalid').innerText = invalidCount;
        document.getElementById('sum-score').innerText = `${calculatedMarks}/100`;

        document.getElementById('summary-card').style.display = 'block';
        analyzeBtn.style.display = 'none';
        const submitBtn = document.getElementById('btn-submit');
        submitBtn.style.display = 'flex';
        submitBtn.innerText = `गुण सबमिट करा (${calculatedMarks})`;
      }, 600);
    }

    function submitScoreAndClose() {
      localStorage.setItem('scanned_result', JSON.stringify({
        id: studentId,
        marks: calculatedMarks,
        timestamp: Date.now()
      }));
      window.close();
    }
  </script>
</body>
</html>
