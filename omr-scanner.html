<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>नवोदय OMR शीट लाइव्ह स्कॅनर</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700;800&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', sans-serif; }
    body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }

    .header-box { text-align: center; margin-bottom: 10px; width: 100%; max-width: 380px; }
    .header-box h2 { font-size: 1.15rem; color: #38bdf8; font-weight: 800; }
    .header-box p { font-size: 0.88rem; color: #94a3b8; }
    .std-badge { background: #1e293b; color: #fef08a; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.95rem; display: inline-block; margin-top: 4px; border: 1px solid #334155; }

    /* उभी आयताकृती कॅमेरा फ्रेम (रेड ते ग्रीन लाइव्ह बॉर्डर) */
    .camera-frame {
      position: relative;
      width: 100%;
      max-width: 290px;
      height: 380px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 4px solid #ef4444; /* सुरुवातीला RED */
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }
    .camera-frame.detected-green {
      border-color: #10b981 !important;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.7) !important;
    }
    video { width: 100%; height: 100%; object-fit: cover; }

    .guide-overlay {
      position: absolute;
      inset: 10px;
      border: 2px dashed rgba(239, 68, 68, 0.85);
      border-radius: 10px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
    }
    .camera-frame.detected-green .guide-overlay { border-color: rgba(52, 211, 153, 0.95); }
    .status-pill {
      background: rgba(220, 38, 38, 0.9);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
    }
    .camera-frame.detected-green .status-pill { background: rgba(5, 150, 105, 0.95) !important; }

    /* गोशवारा कार्ड */
    .summary-card {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      color: #0f172a;
      border-radius: 14px;
      padding: 12px;
      margin-top: 12px;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
    .sum-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px; font-size: 0.84rem; font-weight: 700; display: flex; justify-content: space-between; }
    .score-banner { background: #059669; color: white; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }

    .btn-wrap { display: flex; gap: 8px; width: 100%; max-width: 340px; margin-top: 12px; }
    .btn { flex: 1; height: 46px; border-radius: 10px; border: none; font-weight: 800; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-cancel { background: #334155; color: white; }
    .btn-submit { background: #10b981; color: white; }
  </style>
</head>
<body>

  <div class="header-box">
    <h2><i class="fa-solid fa-camera"></i> नवोदय OMR शीट स्कॅनर</h2>
    <div class="std-badge" id="std-display">विद्यार्थी: लोड होत आहे...</div>
  </div>

  <div class="camera-frame" id="cam-frame">
    <video id="video" autoplay playsinline></video>
    <div class="guide-overlay">
      <span class="status-pill" id="status-pill">❌ OMR शीट दिसत नाही</span>
      <span style="background:rgba(15,23,42,0.8); color:#cbd5e1; font-size:0.75rem; padding:3px 10px; border-radius:12px;">⬇️ संपूर्ण ८० प्रश्न चौकटीत धरा</span>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <div class="summary-card" id="summary-card">
    <div style="font-weight:800; color:#059669; border-bottom:1.5px solid #e2e8f0; padding-bottom:4px;">
      <i class="fa-solid fa-square-poll-vertical"></i> OMR तपासणी गोशवारा:
    </div>
    <div class="summary-grid">
      <div class="sum-item">सोडवलेले: <strong id="sum-attempted" style="font-family:'Poppins';">--/80</strong></div>
      <div class="sum-item" style="color:#16a34a;">बरोबर: <strong id="sum-correct" style="font-family:'Poppins';">--</strong></div>
      <div class="sum-item" style="color:#dc2626;">चुकीचे: <strong id="sum-wrong" style="font-family:'Poppins';">--</strong></div>
      <div class="sum-item" style="color:#d97706;">दुहेरी/अवैध: <strong id="sum-invalid" style="font-family:'Poppins';">--</strong></div>
    </div>
    <div class="score-banner">
      <span>अंतिम गुण (प्रत्येकी १.२५ गुण):</span>
      <span id="sum-score" style="font-size:1.3rem; font-family:'Poppins'; color:#fef08a;">--/100</span>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="btn btn-cancel" onclick="window.close()"><i class="fa-solid fa-xmark"></i> रद्द करा</button>
    <button class="btn btn-submit" id="btn-submit" style="display:none;" onclick="submitScoreAndClose()"><i class="fa-solid fa-check"></i> हे गुण सबमिट करा</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');
    const studentName = decodeURIComponent(urlParams.get('name') || 'विद्यार्थी');
    const testNo = urlParams.get('test') || '6';

    document.getElementById('std-display').innerText = `विद्यार्थी: ${studentName}`;

    let videoStream = null;
    let detectionInterval = null;
    let stableFrames = 0;
    let autoCaptured = false;
    let calculatedMarks = 0;

    // Answer Key मिळवणे
    const savedKeys = JSON.parse(localStorage.getItem('omr_saved_key') || '{}');

    // १. कॅमेरा सुरू करणे
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          videoStream = stream;
          const video = document.getElementById('video');
          video.srcObject = stream;
          detectionInterval = setInterval(analyzeLiveFrame, 160);
        })
        .catch(err => alert("कॅमेरा सुरू होऊ शकला नाही: " + err.message));
    }

    // २. लाइव्ह फ्रेम तपासणी (रेड ते ग्रीन)
    function analyzeLiveFrame() {
      if (autoCaptured) return;
      const video = document.getElementById('video');
      if (!video || video.readyState !== 4) return;

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      // पांढरा कागद + उभ्या ३ गॅप्स तपासणी
      let lightPixels = 0, totalSampled = 0;
      for (let y = canvas.height * 0.2; y < canvas.height * 0.8; y += 12) {
        for (let x = canvas.width * 0.2; x < canvas.width * 0.8; x += 12) {
          const idx = (Math.floor(y) * canvas.width + Math.floor(x)) * 4;
          const br = pixels[idx] * 0.299 + pixels[idx+1] * 0.587 + pixels[idx+2] * 0.114;
          if (br > 130) lightPixels++;
          totalSampled++;
        }
      }

      const frameBox = document.getElementById('cam-frame');
      const statusPill = document.getElementById('status-pill');
      const isOmr = (lightPixels / totalSampled) > 0.60;

      if (isOmr) {
        stableFrames++;
        frameBox.classList.add('detected-green');
        statusPill.innerText = "✅ OMR शीट जुळली (स्थिर ठेवा)";
        if (stableFrames >= 3) {
          autoCaptured = true;
          statusPill.innerText = "📸 आपोआप कॅप्चर झाले!";
          processOmrPixels(pixels, canvas.width, canvas.height);
        }
      } else {
        stableFrames = 0;
        frameBox.classList.remove('detected-green');
        statusPill.innerText = "❌ OMR शीट दिसत नाही";
      }
    }

    // ३. प्रत्यक्ष ८० प्रश्नांची वर्तुळे तपासणे
    function processOmrPixels(pixels, vWidth, vHeight) {
      clearInterval(detectionInterval);

      function getDarkness(cx, cy) {
        let dark = 0, count = 0;
        for (let x = cx - 5; x <= cx + 5; x += 2) {
          for (let y = cy - 5; y <= cy + 5; y += 2) {
            const idx = (Math.floor(y) * vWidth + Math.floor(x)) * 4;
            const br = pixels[idx] * 0.299 + pixels[idx+1] * 0.587 + pixels[idx+2] * 0.114;
            if (br < 120) dark++;
            count++;
          }
        }
        return dark / count;
      }

      const tableLeft = vWidth * 0.11, tableTop = vHeight * 0.16;
      const colWidth = (vWidth * 0.78) / 4, rowHeight = (vHeight * 0.74) / 20;
      const letters = ['A', 'B', 'C', 'D'];
      let studentAns = {};

      for (let col = 0; col < 4; col++) {
        for (let row = 0; row < 20; row++) {
          const q = col * 20 + (row + 1);
          const qY = tableTop + (row + 0.5) * rowHeight;
          const qX = tableLeft + col * colWidth;

          let detected = [];
          for (let i = 0; i < 4; i++) {
            const bX = qX + (colWidth * 0.32) + (i * (colWidth * 0.16));
            if (getDarkness(bX, qY) > 0.38) detected.push(letters[i]);
          }
          studentAns[q] = detected.length === 1 ? detected[0] : (detected.length > 1 ? 'INVALID' : null);
        }
      }

      let attempted = 0, correct = 0, wrong = 0, invalid = 0;
      for (let q = 1; q <= 80; q++) {
        const ans = studentAns[q];
        const key = savedKeys[q];
        if (ans === 'INVALID') { invalid++; attempted++; }
        else if (ans) {
          attempted++;
          if (ans === key) correct++;
          else wrong++;
        }
      }

      calculatedMarks = parseFloat((correct * 1.25).toFixed(2));

      document.getElementById('sum-attempted').innerText = `${attempted}/80`;
      document.getElementById('sum-correct').innerText = correct;
      document.getElementById('sum-wrong').innerText = wrong;
      document.getElementById('sum-invalid').innerText = invalid;
      document.getElementById('sum-score').innerText = `${calculatedMarks}/100`;

      document.getElementById('summary-card').style.display = 'block';
      document.getElementById('btn-submit').style.display = 'flex';
      document.getElementById('btn-submit').innerText = `हे गुण सबमिट करा (${calculatedMarks})`;
    }

    // ४. गुण मुख्य पानाकडे पाठवणे
    function submitScoreAndClose() {
      localStorage.setItem('scanned_result', JSON.stringify({
        id: studentId,
        marks: calculatedMarks,
        timestamp: Date.now()
      }));
      window.close();
    }
  </script>
</body>
</html>
