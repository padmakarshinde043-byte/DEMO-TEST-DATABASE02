<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>मोबाईल OMR तपासणी व टच व्हॅलिडेर</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700;800&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', sans-serif; }
    body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }

    .header-box { text-align: center; margin-bottom: 8px; width: 100%; max-width: 380px; }
    .header-box h2 { font-size: 1.12rem; color: #38bdf8; font-weight: 800; }
    .std-badge { background: #1e293b; color: #fef08a; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.92rem; display: inline-block; margin-top: 4px; border: 1px solid #334155; }

    .preview-frame {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 320px;
      background: #1e293b;
      border: 3.5px dashed #38bdf8;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .preview-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
    }
    .action-prompt { text-align: center; padding: 16px; }
    .action-prompt i { font-size: 2.8rem; color: #38bdf8; margin-bottom: 8px; }
    .action-prompt p { font-size: 0.9rem; color: #cbd5e1; font-weight: 700; line-height: 1.4; }

    .choice-btns { display: flex; gap: 8px; width: 100%; margin-top: 12px; padding: 0 10px; }
    .choice-btn { flex: 1; padding: 10px 4px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }

    /* मोबाईल टच व्हॅलिडेर पॅनल */
    .verification-panel {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      color: #0f172a;
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-height: 250px;
      overflow-y: auto;
    }
    .q-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; font-weight: 700; }
    .options-group { display: flex; gap: 4px; }
    .opt-badge { width: 28px; height: 28px; border: 1.5px solid #0284c7; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; cursor: pointer; color: #0284c7; background: #fff; }
    .opt-badge.selected { background: #0284c7; color: white; font-weight: 800; }

    .summary-card {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      color: #0f172a;
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .score-banner { background: #059669; color: white; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }

    .btn-wrap { display: flex; gap: 8px; width: 100%; max-width: 340px; margin-top: 10px; }
    .btn { flex: 1; height: 48px; border-radius: 10px; border: none; font-weight: 800; font-size: 0.98rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-cancel { background: #334155; color: white; }
    .btn-analyze { background: #d97706; color: white; font-size: 0.92rem; display: none; }
    .btn-submit { background: #10b981; color: white; display: none; }
  </style>
</head>
<body>

  <div class="header-box">
    <h2><i class="fa-solid fa-mobile-screen"></i> मोबाईल OMR टच तपासणी</h2>
    <div class="std-badge" id="std-display">विद्यार्थी: लोड होत आहे...</div>
    <div id="key-status" style="font-size:0.75rem; color:#34d399; margin-top:2px;">उत्तरतालिका: तपासत आहे...</div>
  </div>

  <div class="preview-frame" id="preview-frame">
    <div class="action-prompt" id="action-prompt">
      <i class="fa-solid fa-camera-retro"></i>
      <p>OMR शीटचा फोटो निवडा:</p>
      <div class="choice-btns">
        <button class="choice-btn" onclick="document.getElementById('camera-input').click()">
          <i class="fa-solid fa-camera"></i> कॅमेरा
        </button>
        <button class="choice-btn" style="background:#059669;" onclick="document.getElementById('gallery-input').click()">
          <i class="fa-solid fa-folder-open"></i> गॅलरी
        </button>
      </div>
    </div>
    
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;" onchange="handleImageSelection(event)">
    <input type="file" id="gallery-input" accept="image/*" style="display:none;" onchange="handleImageSelection(event)">
    
    <img id="selected-img" alt="OMR Sheet">
  </div>

  <!-- मोबाईल टच व्हॅलिडेर (इथे शिक्षक एका क्लिकवर उत्तरे तपासू किंवा बदलू शकतात) -->
  <div class="verification-panel" id="verification-panel">
    <div style="font-weight:800; color:#0284c7; border-bottom:1.5px solid #e2e8f0; padding-bottom:4px; margin-bottom:6px;">
      <i class="fa-solid fa-hand-pointer"></i> विद्यार्थ्याचे उत्तर तपासा/बदला (Touch Verify):
    </div>
    <div id="questions-list"></div>
  </div>

  <div class="summary-card" id="summary-card">
    <div style="font-weight:800; color:#059669; border-bottom:1.5px solid #e2e8f0; padding-bottom:4px;">
      <i class="fa-solid fa-square-poll-vertical"></i> अंतिम गुण गोशवारा:
    </div>
    <div class="score-banner">
      <span>एकूण गुण (प्रत्येकी २ गुण):</span>
      <span id="sum-score" style="font-size:1.3rem; font-family:'Poppins'; color:#fef08a;">0/50</span>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="btn btn-cancel" onclick="window.close()"><i class="fa-solid fa-xmark"></i> रद्द करा</button>
    <button class="btn btn-analyze" id="btn-analyze" onclick="startVerificationProcess()"><i class="fa-solid fa-list-check"></i> उत्तरे तपासायला घ्या</button>
    <button class="btn btn-submit" id="btn-submit" onclick="submitScoreAndClose()"><i class="fa-solid fa-check"></i> गुण सबमिट करा</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');
    const studentName = decodeURIComponent(urlParams.get('name') || 'विद्यार्थी');

    document.getElementById('std-display').innerText = `विद्यार्थी: ${studentName}`;

    let studentAnswers = {};
    for(let i=1; i<=25; i++) studentAnswers[i] = null; // २५ प्रश्न

    const rawKeys = JSON.parse(localStorage.getItem('omr_saved_key') || '{}');
    const savedKeys = {};
    for (let i = 1; i <= 25; i++) {
      if (rawKeys[i]) savedKeys[i] = String(rawKeys[i]).trim().toUpperCase();
    }

    const keyCount = Object.keys(savedKeys).length;
    if (keyCount > 0) {
      document.getElementById('key-status').innerText = `✅ उत्तरतालिका उपलब्ध (${keyCount} प्रश्न)`;
    } else {
      document.getElementById('key-status').innerText = `⚠️ उत्तरतालिका मिळालेली नाही!`;
      document.getElementById('key-status').style.color = '#ef4444';
    }

    function handleImageSelection(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('selected-img');
        preview.src = e.target.result;
        preview.style.display = 'block';
        
        document.getElementById('action-prompt').style.display = 'none';
        document.getElementById('btn-analyze').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function startVerificationProcess() {
      document.getElementById('btn-analyze').style.display = 'none';
      const qList = document.getElementById('questions-list');
      qList.innerHTML = '';

      for (let i = 1; i <= 25; i++) {
        let row = document.createElement('div');
        row.className = 'q-row';
        row.innerHTML = `<span>प्रश्न ${i < 10 ? '0' + i : i}:</span>
          <div class="options-group" id="opt-group-${i}">
            <div class="opt-badge" onclick="setAnswer(${i}, 'A')">A</div>
            <div class="opt-badge" onclick="setAnswer(${i}, 'B')">B</div>
            <div class="opt-badge" onclick="setAnswer(${i}, 'C')">C</div>
            <div class="opt-badge" onclick="setAnswer(${i}, 'D')">D</div>
          </div>`;
        qList.appendChild(row);
      }

      document.getElementById('verification-panel').style.display = 'block';
      document.getElementById('summary-card').style.display = 'block';
      document.getElementById('btn-submit').style.display = 'flex';
      calculateAndUpdateScore();
    }

    function setAnswer(qNo, opt) {
      if (studentAnswers[qNo] === opt) {
        studentAnswers[qNo] = null; // पुन्हा क्लिक केल्यास निवड रद्द होईल
      } else {
        studentAnswers[qNo] = opt;
      }

      // UI अपडेट करणे
      const group = document.getElementById(`opt-group-${qNo}`);
      const badges = group.getElementsByClassName('opt-badge');
      for (let b of badges) {
        if (b.innerText === studentAnswers[qNo]) {
          b.classList.add('selected');
        } else {
          b.classList.remove('selected');
        }
      }
      calculateAndUpdateScore();
    }

    function calculateAndUpdateScore() {
      let correctCount = 0;
      for (let q = 1; q <= 25; q++) {
        if (studentAnswers[q] && studentAnswers[q] === savedKeys[q]) {
          correctCount++;
        }
      }
      let finalMarks = correctCount * 2; // प्रत्येकी २ गुण
      document.getElementById('sum-score').innerText = `${finalMarks}/50`;
      document.getElementById('btn-submit').innerText = `गुण सबमिट करा (${finalMarks}/50)`;
    }

    function submitScoreAndClose() {
      let correctCount = 0;
      for (let q = 1; q <= 25; q++) {
        if (studentAnswers[q] && studentAnswers[q] === savedKeys[q]) correctCount++;
      }
      let finalMarks = correctCount * 2;

      localStorage.setItem('scanned_result', JSON.stringify({
        id: studentId,
        marks: finalMarks,
        timestamp: Date.now()
      }));
      window.close();
    }
  </script>
</body>
</html>
